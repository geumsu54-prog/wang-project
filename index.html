<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Wang Project - 3D 전통 기와집</title>
    <style>body { margin: 0; background-color: #cae5ff; overflow: hidden; }</style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xcae5ff);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 사방에서 밝게 비추는 빛 추가
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 2.0);
        sunLight.position.set(50, 100, 50);
        scene.add(sunLight);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        // 3D 모델 불러오기 및 위치/크기 자동 맞춤
        const loader = new THREE.GLTFLoader();
        loader.load('island-glb.glb', function (gltf) {
            const hanok = gltf.scene;
            scene.add(hanok);

            // 모델의 크기와 중앙 위치 계산
            const box = new THREE.Box3().setFromObject(hanok);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            
            const maxDim = Math.max(size.x, size.y, size.z);
            
            // 카메라 시점을 모델 전체가 한눈에 보이도록 멀리 이동
            camera.position.set(center.x + maxDim * 1.5, center.y + maxDim * 0.8, center.z + maxDim * 1.5);
            controls.target.copy(center);
            controls.update();

        }, undefined, function (error) {
            console.error('3D 모델 로딩 실패:', error);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
