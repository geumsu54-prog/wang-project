<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Wang Project - 3D 전통 기와집</title>
    <style>
        body { margin: 0; background-color: #cae5ff; overflow: hidden; }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 22px; font-weight: bold; color: #333; font-family: sans-serif;
            background: rgba(255,255,255,0.9); padding: 15px 30px; border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div id="loading">3D 기와집 불러오는 중... (잠시만 기다려주세요)</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xcae5ff);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 2.0);
        sunLight.position.set(50, 100, 50);
        scene.add(sunLight);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        const loader = new THREE.GLTFLoader();
        loader.load('island-glb.glb', function (gltf) {
            const hanok = gltf.scene;
            scene.add(hanok);

            // 로딩이 끝나면 안내 문구 숨기기
            document.getElementById('loading').style.display = 'none';

            const box = new THREE.Box3().setFromObject(hanok);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            
            camera.position.set(center.x + maxDim * 1.5, center.y + maxDim * 0.8, center.z + maxDim * 1.5);
            controls.target.copy(center);
            controls.update();

        }, function (xhr) {
            // 다운로드 진행률 표시
            if (xhr.lengthComputable) {
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                document.getElementById('loading').innerText = `기와집 다운로드 중... (${percent}%)`;
            }
        }, function (error) {
            console.error('3D 모델 로딩 실패:', error);
            document.getElementById('loading').innerText = '파일 로딩 실패! 파일 이름을 확인해주세요.';
            document.getElementById('loading').style.color = 'red';
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
