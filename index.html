<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Wang Project - 3D 전통 기와집</title>
    <style>body { margin: 0; background-color: #cae5ff; overflow: hidden; }</style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xcae5ff);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 조명 설정
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
        sunLight.position.set(10, 20, 10);
        scene.add(sunLight);

        // 마우스 컨트롤
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        // 3D 모델 불러오기 (올리신 island-glb.glb 파일 연결)
        const loader = new THREE.GLTFLoader();
        loader.load('island-glb.glb', function (gltf) {
            const hanok = gltf.scene;
            scene.add(hanok);
            
            // 카메라 위치 잡기
            camera.position.set(10, 5, 10);
            controls.update();
        }, undefined, function (error) {
            console.error('3D 모델 로딩 실패:', error);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
